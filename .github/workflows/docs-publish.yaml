# SPDX-License-Identifier: Apache-2.0
name: Publish CLI Docs

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'

permissions:
  contents: read

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore.noblefactor.com

      - name: Checkout CLI repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate CLI docs
        run: make docs DEVLORE_VERSION=${{ steps.version.outputs.version }}

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore.noblefactor.com
          token: ${{ steps.app-token.outputs.token }}
          path: site

      - name: Update site content
        run: |
          rm -rf site/src/content/cli/
          cp -r docs/cli/ site/src/content/cli/
          rm -rf site/src/content/guides/
          cp -r docs/guides/ site/src/content/guides/

      - name: Create and merge PR on site repo
        working-directory: site
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="cli-docs/update-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/cli/ src/content/guides/
          if git diff --cached --quiet; then
            echo "No changes to docs, skipping PR."
            exit 0
          fi
          git commit -m "Update docs from devlore-cli@${GITHUB_SHA::7}"
          git push origin "$BRANCH"
          BODY="Automated update from [devlore-cli@\`${GITHUB_SHA::7}\`](https://github.com/NobleFactor/devlore-cli/commit/${GITHUB_SHA}).

          Triggered by push to \`${GITHUB_REF_NAME}\` branch.

          Includes CLI reference (generated) and guides (hand-written)."
          PR_URL=$(gh pr create \
            --title "Update CLI documentation" \
            --body "$BODY" \
            --base develop)
          echo "Created PR: $PR_URL"
          # --admin disarms gh's client-side merge-state veto, which reads the PR as
          # BLOCKED while required checks are pending (the race that stranded site PR
          # #209); the server-side entitlement is the NobleFactor Automation app's
          # "always" bypass on the org ruleset, not repository admin rights. The
          # ruleset's review requirement is what rules out --auto (ruling 2026-07-27).
          # Retry bounded: a transient GitHub 5xx must not strand a green PR (a 502
          # stranded site PR #212), and a failed attempt may still have merged
          # server-side, so the PR state is consulted before retrying.
          merged=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --admin --squash --delete-branch; then
              merged=true
              break
            fi
            state=$(gh pr view "$PR_URL" --json state --jq .state || echo UNKNOWN)
            if [ "$state" = "MERGED" ]; then
              echo "merge attempt $attempt reported failure but the PR is merged"
              merged=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "merge attempt $attempt failed (state: $state); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          if [ "$merged" != "true" ]; then
            echo "merge failed after 5 attempts" >&2
            exit 1
          fi
