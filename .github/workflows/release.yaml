# Release workflow: builds binaries and creates GitHub releases

name: Release

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Default version for non-tag builds
  DEVLORE_VERSION: v0.1.0-draft
  # Where the site serves install.sh and install.ps1. The site releases from develop (ruled 2026-09-26), so every
  # release's summary names the develop environment's installers (#962). Moving the site is this one line.
  INSTALLERS_URL: https://delightful-grass-0ac0a4c1e-develop.westus2.6.azurestaticapps.net

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devlore-cli
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Determine version and release type
        id: version
        run: |
          # Per https://docs.github.com/en/rest/releases/releases:
          # - Full releases: served by /releases/latest
          # - Prereleases: not served by /releases/latest. The installers' "latest" reads /releases?per_page=1, which
          #   includes them, so a prerelease installs without an explicit DEVLORE_VERSION
          # - Drafts: require push (write) access, not suitable for distribution
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            PRERELEASE="false"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="v0.1.0-rc.$(date +%Y%m%d%H%M%S)"
            PRERELEASE="true"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            BRANCH_NAME="${{ github.ref_name }}"
            VERSION="v${BRANCH_NAME#release/}-rc.$(date +%Y%m%d%H%M%S)"
            PRERELEASE="true"
          else
            # develop and other branches
            VERSION="v0.1.0-dev.$(date +%Y%m%d%H%M%S)"
            PRERELEASE="true"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (prerelease: $PRERELEASE)"

      - name: Build distribution
        run: make dist DEVLORE_VERSION=${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        # Per https://cli.github.com/manual/gh_release_create
        run: |
          RELEASE_ARGS=""
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            RELEASE_ARGS="--prerelease"
          fi

          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Release ${{ steps.version.outputs.version }}

          Source: ${{ github.repository }}@${{ github.sha }}
          Ref: ${{ github.ref }}" \
            $RELEASE_ARGS \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          # What was built, where each platform's products are, and where the installers are (#962). Every address is
          # derived: the archives from dist/, which is exactly what the release uploaded, and the installers from
          # INSTALLERS_URL, stated once above. No token: the repository is public and the installers need none.
          shopt -s nullglob
          archives=(dist/devlore-cli_"${TAG}"_*.tar.gz dist/devlore-cli_"${TAG}"_*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "no archives for ${TAG} in dist/" >&2
            exit 1
          fi

          pin="\$env:DEVLORE_VERSION = '${TAG}'; irm ${INSTALLERS_URL}/install.ps1 | iex"

          # shellcheck disable=SC2016 # the backticks are Markdown code fences, printed as written
          {
            printf '## devlore-cli %s, built from %s at %s\n\n' "${TAG}" "${REF_NAME}" "${SHA:0:8}"
            printf 'Release: %s/tag/%s\n\n' "${RELEASES}" "${TAG}"
            printf '### Build products\n\nlore, star and writ, in one archive per platform.\n\n'
            printf '| Platform | Address |\n| --- | --- |\n'
            for archive in "${archives[@]}"; do
              name="${archive#dist/}"
              platform="${name#devlore-cli_"${TAG}"_}"
              platform="${platform%.tar.gz}"
              platform="${platform%.zip}"
              printf '| %s | %s/download/%s/%s |\n' "${platform/_//}" "${RELEASES}" "${TAG}" "${name}"
            done
            printf '| checksums | %s/download/%s/devlore-cli_%s_checksums.txt |\n\n' "${RELEASES}" "${TAG}" "${TAG}"
            printf '### Installers\n\n| Installer | Address |\n| --- | --- |\n'
            printf '| install.sh | %s/install.sh |\n' "${INSTALLERS_URL}"
            printf '| install.ps1 | %s/install.ps1 |\n\n' "${INSTALLERS_URL}"
            printf '### Install this release\n\n'
            printf '```bash\ncurl --fail --silent --show-error --location %s/install.sh | DEVLORE_VERSION=%s bash\n```\n\n' \
              "${INSTALLERS_URL}" "${TAG}"
            printf '```powershell\n%s\n```\n' "${pin}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Sync install script to website (keep website as distribution point for script only)
  # Creates a PR instead of pushing directly to respect branch protection rules
  sync-install-script:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore.noblefactor.com

      - name: Checkout devlore-cli
        uses: actions/checkout@v4

      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore.noblefactor.com
          token: ${{ steps.app-token.outputs.token }}
          path: website

      - name: Sync install scripts to website
        run: |
          # Copy the two install scripts only (binaries come from GitHub releases). Both, since #948: the
          # site published install.sh alone, and install.ps1's own usage line was a 404.
          cp install.sh website/public/install.sh
          cp install.ps1 website/public/install.ps1

          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Determine target branch
          TARGET_BRANCH="develop"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_BRANCH="main"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          git checkout "$TARGET_BRANCH" || git checkout -b "$TARGET_BRANCH"

          # Check if there are changes
          git add public/install.sh public/install.ps1
          if git diff --cached --quiet; then
            echo "No changes to the install scripts"
            exit 0
          fi

          # Create a PR branch instead of pushing directly (respects branch protection)
          PR_BRANCH="sync-install-scripts-${{ github.sha }}"
          git checkout -b "$PR_BRANCH"

          git commit -m "Update install scripts

          Source: ${{ github.repository }}@${{ github.sha }}
          Ref: ${{ github.ref }}"
          git push origin "$PR_BRANCH"

          # Create PR using gh CLI
          # Per https://cli.github.com/manual/gh_pr_create
          PR_URL=$(gh pr create \
            --repo NobleFactor/devlore.noblefactor.com \
            --base "$TARGET_BRANCH" \
            --head "$PR_BRANCH" \
            --title "Update install scripts from devlore-cli" \
            --body "Automated sync of install.sh and install.ps1 from devlore-cli.

          Source: ${{ github.repository }}@${{ github.sha }}
          Ref: ${{ github.ref }}")
          echo "Created PR: $PR_URL"
          # Merge directly per the #289 sync philosophy. --admin disarms gh's
          # client-side merge-state veto, which reads the PR as BLOCKED while required
          # checks are pending (the race that stranded site PR #209); the server-side
          # entitlement is the NobleFactor Automation app's "always" bypass on the org
          # ruleset, not repository admin rights. The ruleset's review requirement is
          # what rules out --auto (ruling 2026-07-27). Retry bounded: a transient
          # GitHub 5xx must not strand a green PR (a 502 stranded site PR #212), and a
          # failed attempt may still have merged server-side, so the PR state is
          # consulted before retrying.
          merged=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --repo NobleFactor/devlore.noblefactor.com --admin --squash --delete-branch; then
              merged=true
              break
            fi
            state=$(gh pr view "$PR_URL" --repo NobleFactor/devlore.noblefactor.com --json state --jq .state || echo UNKNOWN)
            if [ "$state" = "MERGED" ]; then
              echo "merge attempt $attempt reported failure but the PR is merged"
              merged=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "merge attempt $attempt failed (state: $state); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          if [ "$merged" != "true" ]; then
            echo "merge failed after 5 attempts" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
