# SPDX-License-Identifier: Apache-2.0
# Extract knowledge base to devlore-registry when source code changes.
# This keeps the LLM context accurate for package generation and migrations.
name: Knowledge Extract

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  knowledge-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore-registry

      - name: Checkout devlore-cli
        uses: actions/checkout@v4
        with:
          path: devlore-cli

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: devlore-cli/go.sum

      - name: Build star tool
        working-directory: devlore-cli
        run: make star

      # Checked out INSIDE the cli tree, and only after the build: star's session root is confined to
      # the directory it runs in, so the target must live inside that tree — and a nested foreign repo
      # must not exist yet while make generates. Accommodating a genuinely cross-root target is #571.
      - name: Checkout devlore-registry
        uses: actions/checkout@v4
        with:
          repository: NobleFactor/devlore-registry
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          path: devlore-cli/devlore-registry

      - name: Build knowledge base
        working-directory: devlore-cli
        run: |
          ./build/star devlore knowledge extract \
            --domain all \
            --source ${{ github.workspace }}/devlore-cli \
            --target ${{ github.workspace }}/devlore-cli/devlore-registry

      - name: Validate package schemas
        working-directory: devlore-cli
        run: |
          ./build/star devlore package validate \
            --target=${{ github.workspace }}/devlore-cli/devlore-registry

      - name: Validate knowledge schemas
        working-directory: devlore-cli
        run: |
          ./build/star devlore knowledge validate \
            --target=${{ github.workspace }}/devlore-cli/devlore-registry

      - name: Report knowledge changes (PR only)
        if: github.event_name == 'pull_request'
        working-directory: devlore-cli/devlore-registry
        run: |
          if git diff --quiet; then
            echo "No knowledge changes detected"
          else
            echo "Knowledge changes detected:"
            git diff --stat
            echo ""
            echo "These changes will be pushed when the PR is merged."
          fi

      - name: Create PR to devlore-registry (push only)
        if: github.event_name == 'push'
        working-directory: devlore-cli/devlore-registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet; then
            echo "No knowledge changes to commit"
            exit 0
          fi

          BRANCH="chore/knowledge-sync-${GITHUB_SHA::7}"
          git checkout -b "$BRANCH"
          git add knowledge/
          git commit -m "chore: sync knowledge from devlore-cli@${{ github.sha }}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --repo NobleFactor/devlore-registry \
            --title "Sync knowledge from devlore-cli@${GITHUB_SHA::7}" \
            --body "Automated knowledge sync from [devlore-cli@\`${GITHUB_SHA::7}\`](https://github.com/NobleFactor/devlore-cli/commit/${GITHUB_SHA})." \
            --base "${{ github.ref_name }}")
          echo "Created PR: $PR_URL"
          # This merge is expected to FAIL when devlore-registry's CI is red, and that is
          # the point: a registry failure must stop this workflow rather than be merged past.
          # devlore-registry carries repository ruleset 21604093, which requires quality-gate
          # and validate-yaml-schemas. The NobleFactor Automation app is a bypass actor on the
          # ORG ruleset (12426847) but NOT on 21604093, so a red check refuses this merge
          # server-side.
          #
          # --admin was removed deliberately. It only disarms gh's client-side merge-state veto
          # and cannot grant entitlement the app does not have, so against 21604093 it bought
          # nothing while implying a power that does not exist -- and it turned a clean refusal
          # into five retries over ~100s before failing anyway.
          #
          # Retry bounded, and still worth keeping: a transient GitHub 5xx must not strand a
          # green PR (a 502 stranded site PR #212), and a failed attempt may still have merged
          # server-side, so the PR state is consulted before retrying.
          merged=false
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_URL" --repo NobleFactor/devlore-registry --squash --delete-branch; then
              merged=true
              break
            fi
            state=$(gh pr view "$PR_URL" --repo NobleFactor/devlore-registry --json state --jq .state || echo UNKNOWN)
            if [ "$state" = "MERGED" ]; then
              echo "merge attempt $attempt reported failure but the PR is merged"
              merged=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "merge attempt $attempt failed (state: $state); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            fi
          done
          if [ "$merged" != "true" ]; then
            echo "merge failed after 5 attempts" >&2
            exit 1
          fi
