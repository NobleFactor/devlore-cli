# SPDX-License-Identifier: SSPL-1.0
name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: make build

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate guide frontmatter
        run: ./scripts/Test-GuideFrontmatter.sh

      - name: Vet
        run: make vet

      - name: Install lint tools
        run: |
          for attempt in 1 2 3; do
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.10.1/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.10.1 && break
            echo "golangci-lint install attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          sudo apt-get update && sudo apt-get install -y shellcheck
          golangci-lint version

      - name: Lint Go
        run: ./build/star lint go ./...

      # Belt-and-suspenders (ruling 2026-08-04, after the silent-pass gate incident): the dogfooded
      # star path above carries the verdict; this direct run guards against any future regression in
      # star's own reporting pipeline.
      - name: Lint Go (direct)
        run: make lint

      - name: Test
        run: make test-race

      - name: Lint Shell
        run: ./build/star lint shell .

      - name: Code metrics
        run: |
          go install github.com/boyter/scc/v3@latest
          scc .
