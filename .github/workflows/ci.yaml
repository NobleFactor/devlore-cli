# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # bash, not the runner default: the default is `bash -e {0}` WITHOUT pipefail, so a failing command
    # feeding a pipe is masked by the success of whatever reads it. The lint-tool install is exactly that
    # shape -- `curl ... | sh` -- and a failed curl let `sh` read empty input and exit 0, so the retry loop
    # below it broke on the first attempt and had never once retried (#439). The sibling `test` and
    # `scenario` jobs already declare this.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # The Makefile requires GNU make 3.82+ for `.ONESHELL:`, and macOS ships 3.81 — the last
      # GPLv2 release, so it will never advance. Without this the multi-line recipes are split into
      # one shell per line and die as `syntax error: unexpected end of file`. The runner is being
      # brought up to the same prerequisite developers hold; ubuntu and windows already satisfy it.
      - name: GNU make 3.82+ (macOS ships 3.81)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      # Every platform the project ships, on every push. The codebase is pure Go — zero `import "C"`
      # — so one runner links the whole matrix with GOOS/GOARCH alone (~41s against ~13s host-only).
      # Before this, the push path built the host alone and swept GOOS at fixed GOARCH, so nothing
      # here ever compiled for arm64 while goreleaser shipped arm64 binaries at release: an
      # arm64-only break surfaced at release rather than at review.
      - name: Build every platform
        run: make build PLATFORM=all

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate guide frontmatter
        run: ./scripts/Test-GuideFrontmatter.sh

      # Per-GOOS analysis (docs/plans/platform-test-matrix.md, #373 phase 1b): vet, lint, and the
      # compiler all honor build constraints, so a single-GOOS pass never sees the other platforms'
      # _darwin.go/_windows.go/_linux.go files. Same runner, one invocation per GOOS. Its first
      # local run found three test files that did not compile under GOOS=windows — the reason three
      # packages reported [build failed] on the windows test leg.
      #
      # `make build-all` used to run here as well. It is dropped rather than kept: `build PLATFORM=all`
      # above covers every package reachable from ./cmd (120 of 122) across all six GOOS/GOARCH pairs
      # rather than three GOOS at the host's arch, and `vet-all` below still type-checks all 122 —
      # test files included, which `go build ./...` never did. The two packages outside cmd's reach
      # (pkg/op/provider/elevator, pkg/op/server) therefore keep their per-GOOS coverage.
      - name: Vet
        run: make vet-all

      - name: Install lint tools
        # The timeouts are what make the retry loop work. Without them a stalled connection hangs
        # indefinitely and the loop never reaches its break-or-retry decision -- retries handle failures,
        # not hangs. Observed 2026-08-18: this step sat 20+ minutes while every other leg finished (#439).
        run: |
          for attempt in 1 2 3; do
            curl -sSfL --connect-timeout 15 --max-time 120 \
              https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.1/install.sh |
              sh -s -- -b "$(go env GOPATH)/bin" v2.13.1 && break
            echo "golangci-lint install attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done
          # Pinned, not @latest: a new shfmt release would change formatting verdicts with no commit on
          # our side. v3.13.1 is what developers run locally.
          timeout 180 go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          # apt gets its own retries and timeouts -- a mirror that accepts the connection and then stalls
          # is the same hang as the curl above, and `timeout` alone would retry nothing.
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y shellcheck
          golangci-lint version

      - name: Lint Go
        run: ./build/star lint go ./...

      # Belt-and-suspenders (ruling 2026-08-04, after the silent-pass gate incident): the dogfooded
      # star path above carries the verdict; this direct run guards against any future regression in
      # star's own reporting pipeline.
      - name: Lint Go (direct)
        run: make lint-all

      - name: Lint Shell
        run: ./build/star lint shell .

      - name: Code metrics
        run: |
          go install github.com/boyter/scc/v3@latest
          scc .

  # Every test on every platform (docs/plans/platform-test-matrix.md, #373). The unit suite used to
  # run in quality-gate on ubuntu alone — 121 packages there, while macOS and Windows ran only the
  # single writ-deploy scenario below. A green scenario leg attested to one test, not to the suite.
  #
  # Non-blocking for now (plan ruling 2), but WITHOUT continue-on-error: the develop ruleset
  # requires exactly one check, `quality-gate`, so a job absent from that list cannot block a merge
  # whatever it reports. continue-on-error would only suppress the red — and the red is the phase-2
  # triage data. Phase 4 is therefore a ruleset change alone, adding the three `test (…)` contexts;
  # this file does not change again. A gate nobody has watched refuse anything is a claim, not a
  # gate, so phase 4 also proves it by making a Windows test fail on purpose.
  test:
    # The check context is the platform descriptor, not the runner label: `test (windows-arm64)`,
    # matching ALL_PLATFORMS and the build/<goos>-<goarch> directories. Without an explicit name
    # GitHub composes the context from every matrix value — `test (windows-11-arm)` — which leaks the
    # runner image into a string the ruleset has to match exactly, and renames all five contexts the
    # moment another matrix key is added.
    name: test (${{ matrix.platform }})
    strategy:
      # Every platform reports independently — a failing leg must not cancel the others' evidence.
      fail-fast: false
      # `include` rather than a bare `os` list so each leg carries its platform descriptor alongside
      # its runner image. Every leg is otherwise identical -- same step, same command.
      #
      # ubuntu-24.04-arm rather than ubuntu-26.04-arm: `ubuntu-latest` is still Ubuntu 24.04, and
      # 26.04 is a preview image. Matching versions across the pair means the arm64 leg varies
      # architecture alone — vary the OS release too and a failure has two candidate causes.
      #
      # The Windows pair cannot be matched that way: `windows-latest` is Windows Server 2025 while
      # `windows-11-arm` is a client OS. There is no Windows Server arm64 runner, so that asymmetry
      # is the platform's, not a choice made here — and the descriptor hides it, as it should.
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: linux-amd64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: windows-amd64, os: windows-latest }
          - { platform: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # The Makefile requires GNU make 3.82+ for `.ONESHELL:`, and macOS ships 3.81 — the last
      # GPLv2 release, so it will never advance. Without this the multi-line recipes are split into
      # one shell per line and die as `syntax error: unexpected end of file`. The runner is being
      # brought up to the same prerequisite developers hold; ubuntu and windows already satisfy it.
      - name: GNU make 3.82+ (macOS ships 3.81)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      # Identical on every leg. Whether -race is actually applied is the Makefile's decision, taken
      # by probing the toolchain: Go ships no ThreadSanitizer runtime for windows/arm64, and that is
      # the sort of fact that rots when a workflow encodes it. When the probe comes back negative the
      # suite still runs, and `make test-race` emits a ::warning:: annotation so an uninstrumented leg
      # is visible on the run summary rather than buried in a log. If upstream ever ships that
      # runtime, the leg starts race-testing with no change here.
      - name: Test
        run: make test-race

  # The writ-deploy scenario (docs/plans/writ-deploy-scenario.md, #346): the real binaries driven
  # end-to-end in a pristine sandbox, on every platform (#91 phase-4 audit slice).
  #
  # Uniform, unlike the test job above: scenarios never use -race, so every leg runs the same
  # command. `include` all the same, so the context is the platform descriptor rather than the
  # runner label — `scenario (windows-arm64)`, matching the test job and build/<goos>-<goarch>.
  scenario:
    name: scenario (${{ matrix.platform }})
    strategy:
      # Every platform reports independently — a failing leg must not cancel the others' evidence.
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: linux-amd64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: windows-amd64, os: windows-latest }
          - { platform: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # The Makefile requires GNU make 3.82+ for `.ONESHELL:`, and macOS ships 3.81 — the last
      # GPLv2 release, so it will never advance. Without this the multi-line recipes are split into
      # one shell per line and die as `syntax error: unexpected end of file`. The runner is being
      # brought up to the same prerequisite developers hold; ubuntu and windows already satisfy it.
      - name: GNU make 3.82+ (macOS ships 3.81)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Writ-deploy scenario
        run: make test-scenario
