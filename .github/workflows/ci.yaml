# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'release/*'
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # bash, not the runner default: the default is `bash -e {0}` WITHOUT pipefail, so a failing command
    # feeding a pipe is masked by the success of whatever reads it. The lint-tool install is exactly that
    # shape -- `curl ... | sh` -- and a failed curl let `sh` read empty input and exit 0, so the retry loop
    # below it broke on the first attempt and had never once retried (#439). The sibling `test` and
    # `scenario` jobs already declare this.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The Makefile requires GNU make 3.82+ for `.ONESHELL:`, and macOS ships 3.81 — the last
      # GPLv2 release, so it will never advance. Without this the multi-line recipes are split into
      # one shell per line and die as `syntax error: unexpected end of file`. The runner is being
      # brought up to the same prerequisite developers hold; ubuntu and windows already satisfy it.
      - name: GNU make 3.82+ (macOS ships 3.81)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build
        run: make build

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate guide frontmatter
        run: ./scripts/Test-GuideFrontmatter.sh

      # Per-GOOS analysis (docs/plans/platform-test-matrix.md, #373 phase 1b): vet, lint, and the
      # compiler all honor build constraints, so a single-GOOS pass never sees the other platforms'
      # _darwin.go/_windows.go/_linux.go files. Same runner, one invocation per GOOS. Its first
      # local run found three test files that did not compile under GOOS=windows — the reason three
      # packages reported [build failed] on the windows test leg.
      - name: Cross-compile every GOOS
        run: make build-all

      - name: Vet
        run: make vet-all

      - name: Install lint tools
        # The timeouts are what make the retry loop work. Without them a stalled connection hangs
        # indefinitely and the loop never reaches its break-or-retry decision -- retries handle failures,
        # not hangs. Observed 2026-08-18: this step sat 20+ minutes while every other leg finished (#439).
        run: |
          for attempt in 1 2 3; do
            curl -sSfL --connect-timeout 15 --max-time 120 \
              https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh |
              sh -s -- -b "$(go env GOPATH)/bin" v2.12.2 && break
            echo "golangci-lint install attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done
          # Pinned, not @latest: a new shfmt release would change formatting verdicts with no commit on
          # our side. v3.13.1 is what developers run locally.
          timeout 180 go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          # apt gets its own retries and timeouts -- a mirror that accepts the connection and then stalls
          # is the same hang as the curl above, and `timeout` alone would retry nothing.
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y shellcheck
          golangci-lint version

      - name: Lint Go
        run: ./build/star lint go ./...

      # Belt-and-suspenders (ruling 2026-08-04, after the silent-pass gate incident): the dogfooded
      # star path above carries the verdict; this direct run guards against any future regression in
      # star's own reporting pipeline.
      - name: Lint Go (direct)
        run: make lint-all

      - name: Lint Shell
        run: ./build/star lint shell .

      - name: Code metrics
        run: |
          go install github.com/boyter/scc/v3@latest
          scc .

  # Every test on every platform (docs/plans/platform-test-matrix.md, #373). The unit suite used to
  # run in quality-gate on ubuntu alone — 121 packages there, while macOS and Windows ran only the
  # single writ-deploy scenario below. A green scenario leg attested to one test, not to the suite.
  #
  # Non-blocking for now (plan ruling 2), but WITHOUT continue-on-error: the develop ruleset
  # requires exactly one check, `quality-gate`, so a job absent from that list cannot block a merge
  # whatever it reports. continue-on-error would only suppress the red — and the red is the phase-2
  # triage data. Phase 4 is therefore a ruleset change alone, adding the three `test (…)` contexts;
  # this file does not change again. A gate nobody has watched refuse anything is a claim, not a
  # gate, so phase 4 also proves it by making a Windows test fail on purpose.
  test:
    strategy:
      # Every platform reports independently — a failing leg must not cancel the others' evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The Makefile requires GNU make 3.82+ for `.ONESHELL:`, and macOS ships 3.81 — the last
      # GPLv2 release, so it will never advance. Without this the multi-line recipes are split into
      # one shell per line and die as `syntax error: unexpected end of file`. The runner is being
      # brought up to the same prerequisite developers hold; ubuntu and windows already satisfy it.
      - name: GNU make 3.82+ (macOS ships 3.81)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      # -race requires cgo and a C toolchain. Set explicitly rather than relying on the default,
      # which varies by platform and by whether a compiler is discoverable; the windows runner
      # ships mingw-w64. `make test-race` depends on `generate`, a chain the scenario job below
      # already exercises on all three platforms.
      - name: Test with race detector
        env:
          CGO_ENABLED: "1"
        run: make test-race

  # The writ-deploy scenario (docs/plans/writ-deploy-scenario.md, #346): the real binaries driven
  # end-to-end in a pristine sandbox, on all three platforms (#91 phase-4 audit slice).
  scenario:
    strategy:
      # Every platform reports independently — a failing leg must not cancel the others' evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The Makefile requires GNU make 3.82+ for `.ONESHELL:`, and macOS ships 3.81 — the last
      # GPLv2 release, so it will never advance. Without this the multi-line recipes are split into
      # one shell per line and die as `syntax error: unexpected end of file`. The runner is being
      # brought up to the same prerequisite developers hold; ubuntu and windows already satisfy it.
      - name: GNU make 3.82+ (macOS ships 3.81)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Writ-deploy scenario
        run: make test-scenario
