name: Triage
on:
  issues:
    types: [opened, transferred]
jobs:
  add-to-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The workflow's own token reports a failure, and checks out the credentials check's script to do it.
    permissions:
      contents: read
      issues: write
    steps:
      - id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      # Ruled 2026-11-04 (noblefactor-engprod#448): an issue found while walking a scenario names it in its body, as
      # "Found while walking #N" or "Found while walking owner/repository#N", and gets its row in the scenario's
      # project, under the scenario's option, instead of a Triage row. A scenario is an open issue of this account
      # whose own row on a project titled "Scenario: ..." has a Scenario option. Anything else goes to Triage, and the
      # log says why.
      - name: Put an issue found while walking a scenario in the scenario
        id: scenario
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.node_id }}
        run: |
          found=$(printf '%s\n' "$BODY" | tr -d '\r' |
            grep -o -E 'Found while walking ([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' | head -n 1 |
            sed 's/^Found while walking //' || true)
          [ -n "$found" ] || exit 0
          case "$found" in
            "#"*) repository=$GITHUB_REPOSITORY ;;
            *) repository=${found%%#*} ;;
          esac
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ "$(lower "${repository%%/*}")" != "$(lower "$GITHUB_REPOSITORY_OWNER")" ]; then
            echo "Found while walking $found: a scenario of another account. The issue goes to Triage."
            exit 0
          fi
          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) { issue(number: $number) { state projectItems(first: 20) { nodes {
              project { id title }
              scenario: fieldValueByName(name: "Scenario") {
                ... on ProjectV2ItemFieldSingleSelectValue {
                  optionId name field { ... on ProjectV2SingleSelectField { id } }
                }
              } } } } } }'
          scenario=$(gh api graphql -f query="$query" \
            -f owner="${repository%%/*}" -f name="${repository#*/}" -F number="${found##*#}") || {
            echo "Found while walking $found: no issue this workflow can read. The issue goes to Triage."
            exit 0
          }
          row=$(jq -c '.data.repository.issue | select(.state == "OPEN")
            | [.projectItems.nodes[]
              | select((.project.title | startswith("Scenario: ")) and .scenario.optionId != null)]
            | first // empty' <<<"$scenario")
          if [ -z "$row" ]; then
            echo "Found while walking $found: not an open scenario with its own row on a Scenario project." \
              "The issue goes to Triage."
            exit 0
          fi
          project=$(jq -r .project.id <<<"$row")
          title=$(jq -r .project.title <<<"$row")
          add='mutation($p: ID!, $c: ID!) {
            addProjectV2ItemById(input: {projectId: $p, contentId: $c}) { item { id } } }'
          item=$(gh api graphql -f query="$add" -f p="$project" -f c="$ISSUE" \
            --jq .data.addProjectV2ItemById.item.id) || {
            echo "Found while walking $found: the issue could not be added to $title. It goes to Triage."
            exit 0
          }
          setting='mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
            updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f,
              value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }'
          field=$(jq -r .scenario.field.id <<<"$row")
          option=$(jq -r .scenario.optionId <<<"$row")
          if ! gh api graphql -f query="$setting" -f p="$project" -f i="$item" -f f="$field" \
            -f o="$option" >/dev/null; then
            remove='mutation($p: ID!, $i: ID!) {
              deleteProjectV2Item(input: {projectId: $p, itemId: $i}) { deletedItemId } }'
            gh api graphql -f query="$remove" -f p="$project" -f i="$item" >/dev/null || true
            echo "Found while walking $found: the scenario's option could not be set. The issue goes to Triage."
            exit 0
          fi
          echo "placed=true" >>"$GITHUB_OUTPUT"
          echo "Found while walking $found: a row of $title under $(jq -r .scenario.name <<<"$row")."
      # Ruled 2026-11-16 (NobleFactor/noblefactor-engprod#573): a Schedule or Scenario issue is its collection's own
      # record, whose row is on its Schedule or Scenario project, and an issue is a row of at most one of its account's
      # projects, so it goes to no Triage project. Its type is read when this step runs.
      - name: Leave a Schedule or Scenario issue out of Triage
        id: collection
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ github.event.issue.node_id }}
        run: |
          query='query($i: ID!) { node(id: $i) { ... on Issue { issueType { name } } } }'
          kind=$(gh api graphql -f query="$query" -f i="$ISSUE" --jq '.data.node.issueType.name // ""')
          case "$kind" in
            Schedule | Scenario)
              echo "collection=true" >>"$GITHUB_OUTPUT"
              echo "A $kind issue: its row is on its $kind project, so it goes to no Triage project."
              ;;
          esac
      - uses: actions/add-to-project@v2.0.0
        id: triage
        if: steps.scenario.outputs.placed != 'true' && steps.collection.outputs.collection != 'true'
        with:
          project-url: ${{ vars.TRIAGE_PROJECT_URL }}
          github-token: ${{ steps.token.outputs.token }}
      - name: Copy the form's Area into the Area field
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.node_id }}
        run: |
          area=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^### Area[[:space:]]*$/ {
            while ((getline line) > 0) if (line !~ /^[[:space:]]*$/) { print line; exit }; exit }')
          [ -n "$area" ] || {
            echo "No Area in the form: the Triage project's Missing Area view will show it."
            exit 0
          }
          query='query($login: String!) { organization(login: $login) { issueFields(first: 30) { nodes {
            ... on IssueFieldSingleSelect { id name options { id name } } } } } }'
          fields=$(gh api graphql -f query="$query" -f login="$GITHUB_REPOSITORY_OWNER")
          fid=$(jq -r '.data.organization.issueFields.nodes[] | select(.name == "Area") | .id' <<<"$fields")
          oid=$(jq -r --arg a "$area" '.data.organization.issueFields.nodes[] | select(.name == "Area")
            | .options[] | select(.name == $a) | .id' <<<"$fields")
          [ -n "$oid" ] || { echo "Area '$area' is not one of the field's options."; exit 0; }
          setting='mutation($i: ID!, $f: ID!, $o: ID!) { setIssueFieldValue(input: {issueId: $i,
            issueFields: [{fieldId: $f, singleSelectOptionId: $o}]}) { clientMutationId } }'
          gh api graphql -f query="$setting" -f i="$ISSUE" -f f="$fid" -f o="$oid" >/dev/null
          echo "Area: $area"
      # Ruled 2026-11-04, in noblefactor-engprod#303's closing: severity applies to bugs only. A bug starts at Medium,
      # the owner's default, until triage changes it; an issue of another type has Severity N/A; and an issue with no
      # type yet gets none and waits for triage, which sets it with the type. An issue that has a Severity keeps it. The
      # type is read when this step runs (noblefactor-engprod#448).
      - name: Set the Severity a new issue starts with
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ github.event.issue.node_id }}
        run: |
          query='query($i: ID!) { node(id: $i) { ... on Issue { issueType { name } issueFieldValues(first: 20) { nodes {
            ... on IssueFieldSingleSelectValue { name field { ... on IssueFieldCommon { name } } } } } } } }'
          record=$(gh api graphql -f query="$query" -f i="$ISSUE")
          current=$(jq -r '.data.node.issueFieldValues.nodes[]
            | select(.field.name == "Severity") | .name' <<<"$record")
          [ -z "$current" ] || { echo "The issue has a Severity already: $current"; exit 0; }
          case "$(jq -r '.data.node.issueType.name // ""' <<<"$record")" in
            "") echo "No type yet: the Severity waits for triage, which sets it with the type."; exit 0 ;;
            Bug) severity=Medium ;;
            *) severity=N/A ;;
          esac
          query='query($login: String!) { organization(login: $login) { issueFields(first: 30) { nodes {
            ... on IssueFieldSingleSelect { id name options { id name } } } } } }'
          fields=$(gh api graphql -f query="$query" -f login="$GITHUB_REPOSITORY_OWNER")
          fid=$(jq -r '.data.organization.issueFields.nodes[] | select(.name == "Severity") | .id' <<<"$fields")
          oid=$(jq -r --arg s "$severity" '.data.organization.issueFields.nodes[] | select(.name == "Severity")
            | .options[] | select(.name == $s) | .id' <<<"$fields")
          [ -n "$oid" ] || { echo "Severity '$severity' is not one of the field's options."; exit 0; }
          setting='mutation($i: ID!, $f: ID!, $o: ID!) { setIssueFieldValue(input: {issueId: $i,
            issueFields: [{fieldId: $f, singleSelectOptionId: $o}]}) { clientMutationId } }'
          gh api graphql -f query="$setting" -f i="$ISSUE" -f f="$fid" -f o="$oid" >/dev/null
          echo "Severity: $severity"
      # An issue meant for Triage that didn't reach it raises an alert at once, with the run's own token, so that it
      # doesn't depend on the token that may have failed: the token's own alert when the token is bad, otherwise "New
      # issues aren't reaching Triage". CLASSIFIED says whether the run could tell where the issue belongs, a step
      # before it having failed. An issue that reached Triage closes that alert, whatever later steps did, and a
      # failure closing it fails the run (noblefactor-engprod#613).
      - uses: actions/checkout@v4
        if: always() && steps.scenario.outputs.placed != 'true' && steps.collection.outputs.collection != 'true'
        with:
          sparse-checkout: .github/credentials-check
      - name: Report an issue that didn't reach Triage
        if: >-
          failure() && steps.triage.outcome != 'success'
          && steps.scenario.outputs.placed != 'true' && steps.collection.outputs.collection != 'true'
        env:
          MODE: report
          KIND: organization
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          TARGETS: ${{ vars.TOKEN_CHECK_TARGETS }}
          ISSUE: ${{ github.event.issue.number }}
          CLASSIFIED: ${{ steps.scenario.outcome == 'success' && steps.collection.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/credentials-check/credentials-check.sh || true
      - name: Close the Triage alert, the issue having reached Triage
        if: ${{ always() && steps.triage.outcome == 'success' }}
        env:
          MODE: placed
          KIND: organization
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/credentials-check/credentials-check.sh
