# Darwin additions, over the suffix-less common project.

packages:
  # GNU tar, which `make dist` requires since #1163: a reproducible archive takes --sort and --mtime, which are
  # GNU tar's, and macOS ships bsdtar. Named as a purl so the claim pins MacPorts and never asks the registry.
  - name: pkg:port/gnutar
